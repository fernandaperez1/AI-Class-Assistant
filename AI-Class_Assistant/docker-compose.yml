version: "3.9"

services:
  db:
    image: postgres:16
    container_name: class_db
    restart: always
    environment:
      POSTGRES_DB: class_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: class_backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    depends_on:
      - db

  bot:
    build: ./bot
    container_name: class_bot
    env_file:
      - ./bot/.env
    depends_on:
      - backend

  frontend:
    build: ./frontend
    container_name: class_frontend
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pg_data:
